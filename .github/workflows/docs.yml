name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs agree with rules/calls.toml
        run: python3 scripts/rules.py check
      - name: Worked examples match their fixtures and rules
        run: python3 scripts/examples.py check
      - name: Calculator reproduces the fixtures
        run: python3 -m unittest discover tests
      - name: The browser page is built from the current sources
        run: python3 scripts/build_web.py --check
      - name: The calculator's schema is built from the current data contract
        run: python3 scripts/build_schema.py --check
      - name: The workbooks and CSV templates are built from the current data contract
        run: python3 scripts/build_workbook.py --check
      - name: Links and anchors resolve
        run: python3 scripts/check_links.py
