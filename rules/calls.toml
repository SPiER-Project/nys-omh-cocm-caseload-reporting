# ======================================================================== Not calls

# Values that follow from the calls above, used by extraction.
[extraction]
# 12 months for metric 9, plus the 365 days before each PHQ-9 for metric 10.
phq_history_months = 13

# Values NYS sets directly.
[nys]
screening_yield_positive_at_or_above = 10

# NYS Appendix A improvement criteria, by scale. A form has improved when its current
# score is at most `fraction_of_baseline` of its baseline (whether exactly that fraction
# counts is the fifty-percent-improved call), or below `or_below`, or at least
# `points_better` below its baseline.
[nys.improvement]
phq9 = { fraction_of_baseline = 0.5, or_below = 10 }
gad7 = { fraction_of_baseline = 0.5, or_below = 10 }
pcl5 = { points_better = 12 }
scared = { fraction_of_baseline = 0.5 }
psc17 = { fraction_of_baseline = 0.5 }
smfq_child = { points_better = 8 }
smfq_parent = { points_better = 6 }
vanderbilt = { fraction_of_baseline = 0.5 }

# The total-score range of each instrument (see docs/reference/instruments.md). The data
# check flags a score outside it. The Vanderbilt has no single total, so it isn't listed.
[score_ranges]
phq2 = [0, 6]
phq9 = [0, 27]
phq_a = [0, 27]
gad7 = [0, 21]
pcl5 = [0, 80]
scared_child = [0, 82]
scared_parent = [0, 82]
smfq_child = [0, 26]
smfq_parent = [0, 26]
psc17 = [0, 34]

# Display names for the scale keys used above.
[scales]
phq9 = "PHQ-9"
gad7 = "GAD-7"
pcl5 = "PCL-5"
scared = "SCARED"
psc17 = "PSC-17"
smfq_child = "SMFQ (child form)"
smfq_parent = "SMFQ (parent form)"
vanderbilt = "NICHQ Vanderbilt"
