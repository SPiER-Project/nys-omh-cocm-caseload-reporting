# The guide's calls, as data.
#
# This file is the single source of truth for every value the guide's calls set: windows,
# thresholds, code lists, and each call's status and approval. The future calculator
# reads its settings from here, and the docs show the same values.
#
# Each [calls.<slug>] matches a "### " heading in docs/reference/our-calls.md, whose
# anchor is the slug. The prose explaining a call stays in that page.
#
# After changing anything here, run:
#     python3 scripts/rules.py sync     # rewrite the values shown in the docs
#     python3 scripts/rules.py check    # confirm docs and rules agree (also run in CI)
#
# Every call has:
#   group     the heading it sits under in the our-calls summary table
#   firmness  nys-says | our-call | needs-clinical-sign-off
#   status    proposed | adopted                       (has the project agreed it?)
#   approval  needed | approved | confirmed-by-nys     (can it be relied on?)
# Every other key is a value the call sets.

