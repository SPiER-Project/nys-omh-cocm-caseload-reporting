# ------------------------------------------------------------------- Scales and outcomes

[calls.primary-scale]
title = "Primary scale"
group = "Scales and outcomes"
firmness = "our-call"
status = "adopted"
approval = "needed"

[[calls.primary-scale.default_mapping]]
diagnosis = "Depression, adult"
scales = ["phq9"]

[[calls.primary-scale.default_mapping]]
diagnosis = "Depression, adolescent"
scales = ["phq9", "smfq_child"]
note = "the site picks one and uses it for every adolescent"

[[calls.primary-scale.default_mapping]]
diagnosis = "Anxiety, adult"
scales = ["gad7"]

[[calls.primary-scale.default_mapping]]
diagnosis = "Anxiety, child or adolescent"
scales = ["scared"]

[[calls.primary-scale.default_mapping]]
diagnosis = "PTSD"
scales = ["pcl5"]

[[calls.primary-scale.default_mapping]]
diagnosis = "ADHD"
scales = ["vanderbilt"]

[[calls.primary-scale.default_mapping]]
diagnosis = "General pediatric behavioral concern"
scales = ["psc17"]

[calls.baseline]
title = "Baseline"
group = "Scales and outcomes"
firmness = "our-call"
status = "adopted"
approval = "needed"
window_days = 14             # days after the enrollment date

[calls.elevated-baseline]
title = "Elevated baseline"
group = "Scales and outcomes"
firmness = "our-call"
firmness_note = "; needs clinical sign-off beyond PHQ-9 and GAD-7"
status = "proposed"
approval = "needed"

# A baseline is elevated at or above `at_or_above`. A scale with no value can't yet
# count as improved or in remission.
[calls.elevated-baseline.thresholds]
phq9 = { at_or_above = 10, firmness = "our-call" }
gad7 = { at_or_above = 10, firmness = "our-call" }
pcl5 = { at_or_above = 33, firmness = "needs-clinical-sign-off" }
scared = { at_or_above = 25, firmness = "needs-clinical-sign-off" }
psc17 = { at_or_above = 15, firmness = "needs-clinical-sign-off" }
smfq_child = { at_or_above = 12, firmness = "needs-clinical-sign-off" }
smfq_parent = { firmness = "needs-clinical-sign-off" }
vanderbilt = { firmness = "needs-clinical-sign-off" }

[calls.current-score-for-improvement]
title = "Current score for improvement"
group = "Scales and outcomes"
firmness = "our-call"
status = "adopted"
approval = "needed"

[calls.fifty-percent-improved]
title = "Fifty percent improved"
group = "Scales and outcomes"
firmness = "our-call"
status = "adopted"
approval = "needed"
boundary_counts = true       # exactly half the baseline counts as improved

[calls.paired-forms]
title = "Paired forms"
group = "Scales and outcomes"
firmness = "nys-says"
firmness_note = ", for improvement"
status = "adopted"
approval = "needed"

[calls.remission-timing]
title = "Remission timing"
group = "Scales and outcomes"
firmness = "our-call"
status = "proposed"
approval = "needed"

[calls.remission-needs-an-elevated-baseline]
title = "Remission needs an elevated baseline"
group = "Scales and outcomes"
firmness = "our-call"
status = "proposed"
approval = "needed"

[calls.remission-thresholds]
title = "Remission thresholds"
group = "Scales and outcomes"
firmness = "our-call"
firmness_note = "; needs clinical sign-off beyond PHQ-9 and GAD-7"
status = "proposed"
approval = "needed"

# In remission when the score is below `below`, or, for the Vanderbilt, when fewer than
# `symptom_count_below` symptom items are rated 2 or 3.
[calls.remission-thresholds.thresholds]
phq9 = { below = 5, firmness = "our-call" }
gad7 = { below = 5, firmness = "our-call" }
pcl5 = { below = 33, firmness = "needs-clinical-sign-off" }
scared = { below = 25, firmness = "needs-clinical-sign-off" }
psc17 = { below = 15, firmness = "needs-clinical-sign-off" }
smfq_child = { below = 8, firmness = "needs-clinical-sign-off" }
vanderbilt = { symptom_count_below = 6, firmness = "needs-clinical-sign-off" }

[calls.psychiatric-consultation-denominator]
title = "Psychiatric consultation denominator"
group = "Scales and outcomes"
firmness = "our-call"
status = "proposed"
approval = "needed"

